spring:
  application:
    name: citas-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD:CHANGE_ME}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET:CHANGE_ME_MIN_32_CHARS}
      refresh-secret: ${JWT_REFRESH_SECRET:CHANGE_ME_MIN_32_CHARS}
      access-minutes: ${JWT_ACCESS_MINUTES:15}
      refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
